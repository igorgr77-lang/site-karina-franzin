<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Não Concluído | Lord Run VIP</title>
    <!-- Google Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lord-gold': '#ffb703',
                        'karina-orange': '#ff6b35',
                        'dark-bg': '#0a0a0a',
                        'dark-card': '#141414',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'oswald': ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-rose-500 opacity-5 filter blur-[100px] rounded-full"></div>
    </div>
    
    <div class="max-w-md w-full bg-dark-card border border-white/10 p-8 rounded-3xl text-center relative z-10 space-y-6">
        <div class="w-20 h-20 bg-rose-500/10 border border-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto">
            <i data-lucide="alert-triangle" class="w-12 h-12"></i>
        </div>
        
        <div class="space-y-2">
            <h1 class="text-3xl font-oswald font-black uppercase tracking-wide text-white">Pagamento Cancelado</h1>
            <p class="text-gray-400 text-sm">O processo de pagamento foi interrompido ou não foi finalizado.</p>
        </div>
        
        <p class="text-xs text-gray-400 max-w-sm mx-auto">
            Nenhuma cobrança foi realizada no seu cartão. Se você encontrou algum problema com o checkout, ou prefere pagar via PIX, fale diretamente com a gente.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-3 justify-center pt-4">
            <a href="/lord-run-vip/#planos" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-karina-orange text-white rounded-xl font-bold hover:bg-opacity-90 transition-all">
                <span>Tentar Novamente</span>
            </a>
            
            <a href="https://wa.me/5517996566908?text=Olá,%20Karina!%20Tive%20um%20problema%20com%20o%20pagamento%20do%20plano%20no%20cartão%20de%20crédito%20e%20gostaria%20de%20ajuda." class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-white/5 border border-white/10 text-white rounded-xl font-bold hover:bg-white/10 hover:border-white/20 transition-all">
                <i data-lucide="message-circle" class="w-4 h-4"></i>
                <span>Chamar no WhatsApp</span>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
