name = "karina-franzin-seo"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Rota: intercepta todo o site (headers de segurança, redirects e bloqueios)
[[routes]]
pattern = "karinafranzin.com.br/*"
zone_name = "karinafranzin.com.br"

# Guarda os logs (inclui os relatórios de violação da CSP) no painel do Cloudflare
[observability]
enabled = true

# Variáveis de ambiente (os valores secretos são configurados via: wrangler secret put)
[vars]
ENVIRONMENT = "production"

# Não usar: os secrets SUPABASE_URL e SUPABASE_KEY são definidos via CLI:
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_KEY
